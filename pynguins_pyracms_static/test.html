<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
<style type="text/css">
.fullheight, html, body {
  height : auto !important; /* ignored by IE, applied everywhere else */
  height : 100%; /* IE treats as min-height */
  min-height : 100%; /* IE ignores this */
  border-style: solid;
  border-width: 5px;
  border-color: red;
}
</style>
</head>
<body>
<div style="height: 200px; border-color: green; border-style: solid;">I am a box</div>
<div class="fullheight">Hello</div>
</body>
</html>
